services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: matchups-postgres
    environment:
      POSTGRES_DB: matchups
      POSTGRES_USER: matchups
      POSTGRES_PASSWORD: matchups_dev
    ports:
      - "5433:5432"
    volumes:
      - matchups_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchups -d matchups"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matchups_postgres_data:
